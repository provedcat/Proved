<body>
  <div class="food-shell">
    <header data-proved-header="food"></header>

    <main class="food-main">
      <section id="foodListView" class="food-list-view" aria-labelledby="foodListTitle">
        <div class="food-list-hero">
          <p class="food-eyebrow">FOOD FINDER</p>
          <h1 id="foodListTitle">사료 찾기</h1>
          <p class="food-list-hero__lead">이름을 바로 검색하거나, 원하는 조건을 조합해 한곳에서 찾아보세요.</p>
        </div>

        <section class="food-controls" aria-label="사료 목록 검색 및 필터">
          <div class="food-search-field">
            <label for="foodSearchInput">브랜드 또는 제품명 검색</label>
            <div class="food-search-field__row">
              <svg class="food-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
              <input id="foodSearchInput" type="search" autocomplete="off" placeholder="예: RAWZ, 로우즈 연어" spellcheck="false">
              <button id="foodSearchClear" class="food-search-clear" type="button" aria-label="검색어 지우기" hidden>지우기</button>
            </div>
          </div>

          <div class="food-filter-grid">
            <fieldset class="food-filter-group">
              <legend>대상</legend>
              <div class="food-filter-options" id="foodSpeciesFilters">
                <button type="button" data-species="all" aria-pressed="true">전체</button>
                <button type="button" data-species="cat" aria-pressed="false">고양이</button>
                <button type="button" data-species="dog" aria-pressed="false">강아지</button>
              </div>
            </fieldset>

            <fieldset class="food-filter-group">
              <legend>형태</legend>
              <div class="food-filter-options" id="foodTypeFilters">
                <button type="button" data-type="all" aria-pressed="true">전체</button>
                <button type="button" data-type="dry" aria-pressed="false">건사료</button>
                <button type="button" data-type="wet" aria-pressed="false">습식사료</button>
              </div>
            </fieldset>

            <fieldset class="food-filter-group">
              <legend>분류</legend>
              <div class="food-filter-options" id="foodRoleFilters">
                <button type="button" data-role="all" aria-pressed="true">전체</button>
                <button type="button" data-role="주식" aria-pressed="false">주식</button>
                <button type="button" data-role="보조식" aria-pressed="false">보조식</button>
              </div>
            </fieldset>

            <div class="food-sort-group">
              <label for="foodSortSelect">정렬</label>
              <select id="foodSortSelect">
                <option value="brand">브랜드순</option>
                <option value="product">제품명순</option>
              </select>
            </div>
          </div>

        </section>

        <section class="condition-workspace food-condition-workspace" aria-labelledby="foodConditionTitle">
          <div class="food-condition-heading">
            <div><h2 id="foodConditionTitle">조건으로 좁히기</h2><p>폴더를 열어 조건을 검색하고 여러 개를 함께 선택할 수 있습니다.</p></div>
            <button id="foodConditionReset" class="condition-reset" type="button" hidden>선택 전체 해제</button>
          </div>
          <div id="foodConditionFolders" class="condition-folders" aria-label="조건 그룹"></div>
          <div id="foodSelectedConditions" class="condition-selected" aria-live="polite" hidden></div>
          <p id="foodConditionStatus" class="condition-status" role="status">조건을 불러오는 중입니다.</p>
        </section>

        <section class="food-results-section" aria-labelledby="foodResultsHeading">
          <div class="food-results-heading">
            <p id="foodResultsHeading" class="food-results-count" aria-live="polite">사료 목록을 불러오는 중입니다.</p>
            <p class="food-results-note">검수 전 제품은 별도로 표시합니다.</p>
          </div>
          <div id="foodResults" class="food-results" aria-live="polite"></div>
          <div id="foodListStatus" class="food-list-status" role="status"></div>
          <button id="foodLoadMore" class="food-load-more" type="button" hidden>더 보기</button>
        </section>
      </section>

      <section id="foodDetailView" class="food-detail-view" aria-labelledby="foodDetailTitle" hidden>
        <div class="food-detail-toolbar">
          <a id="foodBackToList" class="food-back-button" href="/food/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            사료 찾기로 돌아가기
          </a>
        </div>

        <div id="foodDetailContent"></div>
        <div id="foodDetailStatus" class="food-detail-status" role="status"></div>
      </section>
    </main>

    <footer data-proved-footer></footer>
  </div>
</body>
</html>
