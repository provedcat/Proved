<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사료 | 프루브</title>
  <meta name="description" content="프루브의 고양이·강아지 사료 목록, 조건별 찾기와 사료 등록 요청을 한곳에서 이용합니다.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://proved.kr/food/">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="프루브">
  <meta property="og:title" content="사료 | 프루브">
  <meta property="og:description" content="등록된 사료를 찾고, 조건에 맞는 사료를 살펴보고, 없는 사료의 등록을 요청합니다.">
  <meta property="og:url" content="https://proved.kr/food/">
  <meta property="og:image" content="https://proved.kr/icons/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3568FF">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="/css/proved-header.css?v=20260814-site-structure-v1">
  <script defer src="/js/proved-header.js?v=20260814-site-structure-v1"></script>
  <style>
    :root { --blue:#3568ff; --blue-dark:#2349b8; --line:#cbd7ff; --muted:#6f7685; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--blue-dark); font-family:"SUIT Variable",SUIT,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .hub-shell { width:min(calc(100% - 56px),1120px); margin:0 auto; }
    .hub-main { min-height:58vh; padding:84px 0 20px; }
    .hub-kicker { margin:0 0 14px; color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.1em; }
    h1 { margin:0; color:var(--blue); font-size:clamp(48px,7vw,78px); line-height:1; letter-spacing:-.045em; }
    .hub-copy { max-width:620px; margin:24px 0 54px; font-size:17px; line-height:1.75; }
    .hub-list { border-top:1px solid var(--line); }
    .hub-item { display:grid; grid-template-columns:minmax(160px,.35fr) minmax(0,1fr) auto; gap:24px; align-items:center; min-height:96px; border-bottom:1px solid var(--line); text-decoration:none; }
    .hub-item strong { color:var(--blue); font-size:22px; font-weight:650; }
    .hub-item span { color:var(--muted); font-size:14px; line-height:1.6; }
    .hub-item em { color:var(--blue); font-size:12px; font-style:normal; font-weight:700; }
    .hub-item--disabled { cursor:default; }
    @media (max-width:720px) {
      .hub-shell { width:calc(100% - 36px); }
      .hub-main { padding-top:56px; }
      .hub-copy { margin-bottom:38px; font-size:15px; }
      .hub-item { grid-template-columns:1fr auto; gap:8px 16px; padding:20px 0; }
      .hub-item strong { font-size:19px; }
      .hub-item span { grid-column:1 / -1; }
    }
  </style>
</head>
<body>
  <div class="hub-shell">
    <header data-proved-header="food"></header>
    <main class="hub-main">
      <p class="hub-kicker">FOOD</p>
      <h1>사료</h1>
      <p class="hub-copy">등록된 사료를 확인하고 조건에 맞는 제품을 찾거나, 아직 없는 사료의 등록을 요청할 수 있습니다.</p>

      <section class="hub-list" aria-label="사료 메뉴">
        <div class="hub-item hub-item--disabled" aria-disabled="true">
          <strong>사료 목록</strong>
          <span>등록된 고양이·강아지 사료의 영양정보와 전성분을 확인합니다.</span>
          <em>준비 중</em>
        </div>
        <div class="hub-item hub-item--disabled" aria-disabled="true">
          <strong>조건으로 찾기</strong>
          <span>유형, 주 단백질원 등 원하는 조건으로 사료를 좁혀봅니다.</span>
          <em>준비 중</em>
        </div>
        <a class="hub-item" href="/feed-registration/">
          <strong>등록 요청</strong>
          <span>제품명 또는 라벨 사진으로 데이터베이스에 없는 사료의 등록을 요청합니다.</span>
          <em>열기 →</em>
        </a>
      </section>
    </main>
    <footer class="proved-site-footer" data-proved-footer></footer>
  </div>
</body>
</html>
