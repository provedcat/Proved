<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사료랭킹 MY FIT | 프루브</title>
  <meta name="description" content="최대 5개의 사료를 고르고, 나에게 중요한 기준을 정해 선택한 제품 안에서 상대적인 순위를 확인하는 프루브 MY FIT입니다.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://proved.kr/food-ranking/">

  <meta property="og:locale" content="ko_KR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="프루브">
  <meta property="og:title" content="사료랭킹 MY FIT | 프루브">
  <meta property="og:description" content="좋은 사료의 기준은 하나가 아닙니다. 나의 반려동물을 위해, 나만의 기준을 세우세요.">
  <meta property="og:url" content="https://proved.kr/food-ranking/">
  <meta property="og:image" content="https://proved.kr/icons/icon-512.png">

  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#3568FF">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="/css/proved-header.css?v=20260922-pet-detail-v1">
  <link rel="stylesheet" href="/css/food-list.css?v=20260924-diet-handoff-v1">
  <link rel="stylesheet" href="/css/proved-colors.css?v=20260818-color-system-v2" data-proved-colors>
  <link rel="stylesheet" href="/css/food-ranking-page.css?v=20260928-mobile-first-v1">
  <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script defer src="/js/proved-header.js?v=20260928-my-fit-ranking-v2"></script>
  <script defer src="/js/food-ranking-access.js?v=20260928-beta-user-v1"></script>
</head>
<body class="food-ranking-body">
  <div class="food-shell">
    <header data-proved-header="food"></header>

    <main class="food-ranking-main">
      <section id="myFitAccessLoading" class="food-ranking-state" aria-live="polite">
        <p>MY FIT 접근 권한을 확인하고 있습니다.</p>
      </section>

      <section id="myFitAccessDenied" class="food-ranking-state" aria-labelledby="myFitDeniedTitle" hidden>
        <p class="food-ranking-eyebrow">FOOD RANKING</p>
        <h1 id="myFitDeniedTitle">MY FIT</h1>
        <p>현재 MY FIT 베타에 접근할 수 없는 계정입니다.<br>허용된 계정으로 로그인한 뒤 다시 시도해 주세요.</p>
        <a class="food-ranking-link" href="/food/">사료 찾기로 돌아가기</a>
      </section>

      <section id="myFitRestrictedRoot" class="food-ranking-page" aria-labelledby="myFitTitle" hidden>
        <header class="food-ranking-hero">
          <p class="food-ranking-eyebrow">FOOD RANKING</p>
          <h1 id="myFitTitle">MY FIT</h1>
          <p class="food-ranking-lead">
            좋은 사료의 기준은 하나가 아닙니다.<br>
            나의 반려동물을 위해, 나만의 기준을 세우세요.
          </p>
        </header>

        <section class="food-ranking-intro" aria-labelledby="myFitIntroTitle">
          <p class="food-ranking-step">01</p>
          <h2 id="myFitIntroTitle">내 기준으로 만드는 사료 순위</h2>
          <p>점수 없이, 내가 고른 사료 안에서 내 기준에 따른 상대적인 순위를 보여드립니다.</p>
          <div class="food-ranking-rule">
            <span>사료</span><strong>최대 5개</strong>
            <span>기준</span><strong>최대 5개</strong>
          </div>
        </section>
      </section>
    </main>

    <footer data-proved-footer></footer>
  </div>
</body>
</html>
