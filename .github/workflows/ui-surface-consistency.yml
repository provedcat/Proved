name: Apply UI surface consistency cleanup

on:
  push:
    branches:
      - agent/ui-surface-consistency

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-surface-consistency
          fetch-depth: 0

      - name: Apply cleanup
        run: python .github/scripts/ui_surface_fix.py

      - name: Verify cleanup
        run: |
          set -euo pipefail
          grep -q '.pc-app-shell button:disabled' css/styles.css
          ! grep -q '^button:disabled' css/styles.css
          grep -q '#feedsStep,#ratioStep{background:transparent!important}' css/styles.css
          grep -q '#petInfoStep,#resultArea{background:#fff!important}' css/styles.css
          grep -q 'Current editorial entry flow' css/proved-shell.css
          ! grep -q 'Landing page aligned with the shared Proved design system' css/proved-shell.css
          ! grep -q 'Final cascade for the approved editorial landing surface' css/proved-shell.css
          ! grep -q 'Calculator becomes a page flow' css/proved-header.css
          grep -RIn --include='*.html' '20260816-surface-consistency-v1' . >/dev/null
          git diff --check
          node --check js/proved-shell.js
          node --check js/proved-header.js

      - name: Commit cleanup and remove temporary helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/ui-surface-consistency.yml .github/scripts/ui_surface_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify section surfaces and entry borders'
          git push origin HEAD:agent/ui-surface-consistency
