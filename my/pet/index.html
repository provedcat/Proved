<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>반려동물 | 프루브</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <meta name="theme-color" content="#8F92FF">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/proved-header.css?v=20260922-pet-detail-v1">
  <link rel="stylesheet" href="/css/proved-colors.css?v=20260818-color-system-v2" data-proved-colors>
  <link rel="stylesheet" href="/css/my-page.css?v=20260922-my-foundation-v2">
  <link rel="stylesheet" href="/css/my-pet.css?v=20260924-avatar-entry-v1">
  <script defer src="/js/proved-header.js?v=20260922-pet-detail-v1"></script>
  <script defer src="/js/my-pet.js?v=20260924-avatar-entry-v1"></script>
</head>
<body class="my-body">
  <div class="my-site-shell">
    <header data-proved-header="my"></header>

    <main class="my-pet-page">
      <a class="my-pet-back" href="/my/" aria-label="마이페이지로 돌아가기">← 마이페이지</a>

      <section id="myPetGate" class="my-pet-gate" hidden>
        <p class="my-eyebrow">MY PET</p>
        <h1>반려동물 기록을<br>불러올 수 없습니다.</h1>
        <p id="myPetGateMessage">로그인 후 다시 확인해 주세요.</p>
        <a href="/my/?login=1">마이페이지로 이동</a>
      </section>

      <div id="myPetContent" hidden>
        <header class="my-pet-hero" id="myPetHero">
          <a id="myPetHeroIcon" class="my-pet-hero__icon" href="/my/pet/avatar/" aria-label="나만의 펫 아바타 만들기" title="나만의 펫 아바타 만들기"></a>
          <div>
            <p class="my-eyebrow">MY PET</p>
            <h1 id="myPetName">반려동물</h1>
            <p id="myPetHeroMeta"></p>
          </div>
        </header>

        <section class="my-pet-section" aria-labelledby="myPetProfileTitle">
          <div class="my-pet-section__heading">
            <span>01</span>
            <h2 id="myPetProfileTitle">프로필</h2>
          </div>
          <dl class="my-pet-profile" id="myPetProfile"></dl>
        </section>

        <section class="my-pet-section" aria-labelledby="myPetWeightTitle">
          <div class="my-pet-section__heading">
            <span>02</span>
            <h2 id="myPetWeightTitle">체중 추이</h2>
          </div>
          <div class="my-pet-weight-summary">
            <div><span>최근 체중</span><strong id="petLatestWeight">—</strong></div>
            <div><span>시작 체중</span><strong id="petStartWeight">—</strong></div>
            <div><span>변화량</span><strong id="petWeightDelta">—</strong></div>
          </div>
          <div class="my-pet-chart-wrap">
            <canvas id="petWeightChart" aria-label="반려동물 체중 변화 그래프" role="img"></canvas>
            <p id="petWeightEmpty" class="my-pet-empty" hidden></p>
          </div>
        </section>

        <section class="my-pet-section" aria-labelledby="myPetDietTitle">
          <div class="my-pet-section__heading">
            <span>03</span>
            <h2 id="myPetDietTitle">현재 식단</h2>
          </div>
          <p id="myPetDietDate" class="my-pet-section__meta"></p>
          <div id="myPetDiet" class="my-pet-diet"></div>
        </section>

        <section class="my-pet-section" aria-labelledby="myPetCalculationsTitle">
          <div class="my-pet-section__heading">
            <span>04</span>
            <h2 id="myPetCalculationsTitle">최근 급여 계산</h2>
          </div>
          <div id="myPetCalculations" class="my-pet-calculations"></div>
        </section>
      </div>
    </main>

    <footer data-proved-footer></footer>
  </div>
</body>
</html>
