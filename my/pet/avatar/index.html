<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>나만의 친구 만들기 | 프루브</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <meta name="theme-color" content="#8F92FF">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/proved-header.css?v=20260922-pet-detail-v1">
  <link rel="stylesheet" href="/css/proved-colors.css?v=20260818-color-system-v2" data-proved-colors>
  <link rel="stylesheet" href="/css/my-page.css?v=20260924-favorite-card-v2">
  <link rel="stylesheet" href="/css/my-pet-avatar.css?v=20260929-white-bg">
  <script defer src="/js/proved-header.js?v=20260922-pet-detail-v1"></script>
  <script defer src="/js/pet-avatar-renderer.js?v=20260929-pure-white-v1"></script>
  <script defer src="/js/my-pet-avatar.js?v=20260929-final"></script>
</head>
<body class="my-body">
  <div class="my-site-shell">
    <header data-proved-header="my"></header>

    <main class="my-avatar-page">
      <a class="my-avatar-back" id="avatarBackLink" href="/my/">← 반려동물 페이지</a>

      <section id="avatarGate" class="my-avatar-gate" hidden>
        <p class="my-eyebrow">MY PET AVATAR</p>
        <h1>아바타를 만들<br>반려동물을 찾지 못했습니다.</h1>
        <a href="/my/">마이페이지로 이동</a>
      </section>

      <div id="avatarContent" hidden>
        <header class="my-avatar-hero">
          <p class="my-eyebrow">MY PET AVATAR</p>
          <h1>나만의 친구 만들기</h1>
          <p id="avatarPetMeta">반려동물의 모습을 조합해 대표 아바타를 만듭니다.</p>
        </header>

        <section class="my-avatar-preview-section" aria-labelledby="avatarPreviewTitle">
          <div class="my-avatar-preview"><canvas id="avatarPreview" width="256" height="256" role="img" aria-label="현재 아바타 조합"></canvas></div>
          <div>
            <p class="my-avatar-section-number">01</p>
            <h2 id="avatarPreviewTitle">아바타 프리뷰</h2>
            <strong id="avatarPetName">반려동물</strong>
            <p>아래에서 모습을 선택하고 완성 버튼을 눌러 저장하세요.</p>
          </div>
        </section>

        <section class="my-avatar-builder-shell" aria-labelledby="avatarBuilderTitle">
          <div class="my-avatar-section-heading">
            <p class="my-avatar-section-number">02</p>
            <h2 id="avatarBuilderTitle">편집 항목</h2>
          </div>
          <div class="my-avatar-tabs" id="avatarTabs" role="tablist" aria-label="아바타 편집 항목"></div>
          <div id="avatarOptions" class="my-avatar-panel" role="tabpanel"></div>
          <button type="button" id="avatarSave" class="my-avatar-save">완료하고 저장</button>
          <p id="avatarStatus" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <footer data-proved-footer></footer>
  </div>
</body>
</html>
